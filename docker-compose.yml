version: '3.8'

services:
  # Primary Database (MongoDB with ReplicaSet enabled for ACID Transactions support)
  mongodb:
    image: mongo:7.0
    container_name: premium_store_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "rs.initiate()"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Fastify Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: premium_store_backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/telegram_digital_store?replicaSet=rs0
    depends_on:
      mongodb:
        condition: service_healthy
    restart: always

volumes:
  mongo_data:
